<!doctype html>
<html lang="om">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seensa — Malka Noonoo</title>
    <meta name="description" content="Daashboordii Malka Noonoo — Seensa" />

    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@400;600;700&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/auth.css" />
    <link rel="stylesheet" href="css/ui-ux.css" />

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>
  <body class="auth-page" data-page-title="login.title">
    <!-- ==========================================
       LANGUAGE SWITCHER — Top Right
       ========================================== -->
    <div class="auth-lang-switcher" id="authLangSwitcher">
      <button class="auth-lang-btn" id="authLangBtn" type="button">
        <span class="auth-lang-icon">🌐</span>
        <span class="auth-lang-label" id="authLangLabel">Oromiffa</span>
        <span class="auth-lang-caret">▾</span>
      </button>
      <div class="auth-lang-menu" id="authLangMenu">
        <button type="button" class="auth-lang-item active" data-lang="om">
          <span>🇪🇹</span> <span>Oromiffa</span> <span class="check">✓</span>
        </button>
        <button type="button" class="auth-lang-item" data-lang="am">
          <span>🇪🇹</span> <span>አማርኛ</span> <span class="check">✓</span>
        </button>
        <button type="button" class="auth-lang-item" data-lang="en">
          <span>🇬🇧</span> <span>English</span> <span class="check">✓</span>
        </button>
      </div>
    </div>

    <!-- ==========================================
       AUTH CARD
       ========================================== -->
    <div class="auth-wrap">
      <div class="auth-card">
        <!-- Logo -->
        <a href="index.html" class="auth-logo" aria-label="Malka Noonoo"> ☪ </a>

        <!-- Title -->
        <h1 data-i18n="login.title">Seensa</h1>
        <p class="auth-sub" data-i18n="login.subtitle">
          Daashboordii Malka Noonoo
        </p>

        <!-- Form -->
        <form id="loginForm" class="auth-form" novalidate>
          <!-- Email -->
          <div class="form-row">
            <label for="email" data-i18n="login.email">Imeelii</label>
            <div class="input-wrap">
              <span class="input-icon">✉️</span>
              <input
                type="email"
                id="email"
                name="email"
                required
                autocomplete="email"
                placeholder="admin@malkanoonoo.org"
              />
            </div>
          </div>

          <!-- Password -->
          <div class="form-row">
            <label for="password" data-i18n="login.password"
              >Jecha Darbii</label
            >
            <div class="input-wrap">
              <span class="input-icon">🔒</span>
              <input
                type="password"
                id="password"
                name="password"
                required
                autocomplete="current-password"
                placeholder="••••••••"
              />
              <button
                type="button"
                class="input-toggle"
                id="togglePassword"
                aria-label="Toggle password visibility"
              >
                👁️
              </button>
            </div>
          </div>

          <!-- Remember + Forgot -->
          <div class="form-extras">
            <label class="checkbox-row">
              <input type="checkbox" id="rememberMe" name="remember" />
              <span data-i18n="login.remember">Na yaadadhu</span>
            </label>
            <a
              href="forgot-password.html"
              class="link-forgot"
              data-i18n="login.forgot"
            >
              Jecha Darbii Dagatte?
            </a>
          </div>

          <!-- Submit -->
          <button
            type="submit"
            class="btn btn-primary btn-lg btn-block auth-submit"
            id="submitBtn"
          >
            <span class="btn-text" data-i18n="login.submit">Seeni</span>
            <span class="btn-loader" style="display: none">
              <span class="spinner"></span>
            </span>
          </button>

          <!-- Message -->
          <div id="loginMsg" class="form-message"></div>
        </form>

        <!-- Divider -->
        <div class="auth-divider">
          <span data-i18n="login.or">ykn</span>
        </div>

        <!-- Register link -->
        <p class="auth-footer">
          <span data-i18n="login.no.account">Herrega hin qabduu?</span>
          <a href="register.html" data-i18n="login.register.now"
            >Amma Galmaa'i</a
          >
        </p>

        <!-- Back to home -->
        <a href="index.html" class="auth-back-link">
          <span>←</span>
          <span data-i18n="login.back">Deebi'i Fuula Duraa</span>
        </a>
      </div>

      <!-- Footer note -->
      <p class="auth-note">
        <span data-i18n="footer.copyright"
          >© 2025 Malka Noonoo Mana Marii.</span
        >
      </p>
    </div>

    <!-- ==========================================
       SCRIPTS
       ========================================== -->
    <script src="js/config.js"></script>
    <script src="js/translations.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/ui-ux.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/login.js"></script>
  </body>
</html>
