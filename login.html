<!doctype html>
<html lang="om">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seensa — Malka Noonoo</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/home.css" />
    <link rel="stylesheet" href="css/ui-ux.css" />
    <link rel="stylesheet" href="css/nav.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>
  <body class="auth-page" data-page-title="login.title">
    <div class="auth-wrap">
      <div class="auth-card">
        <div class="auth-lang" id="langSwitcher"></div>
        <a href="index.html" class="auth-logo">☪</a>
        <h1 data-i18n="login.title">Seensa</h1>
        <p class="auth-sub" data-i18n="login.subtitle">
          Daashboordii Malka Noonoo
        </p>

        <form id="loginForm">
          <div class="form-row">
            <label data-i18n="login.email">Imeelii</label>
            <input
              type="email"
              id="email"
              required
              placeholder="admin@malkanoonoo.org"
            />
          </div>
          <div class="form-row">
            <label data-i18n="login.password">Jecha Darbii</label>
            <input
              type="password"
              id="password"
              required
              placeholder="••••••••"
            />
          </div>
          <button
            type="submit"
            class="btn btn-primary btn-block btn-lg"
            data-i18n="login.submit"
          >
            Seeni
          </button>
          <div id="loginMsg" class="form-message"></div>
        </form>

        <p class="auth-footer">
          <a href="index.html" data-i18n="login.back">← Deebi'i Fuula Duraa</a>
        </p>
      </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/translations.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/nav.js"></script>
    <!-- ← Kun dabalii -->
    <script src="js/ui-ux.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
